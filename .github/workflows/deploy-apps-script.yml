name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.clasp.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure Apps Script project
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          if [ -z "$APPS_SCRIPT_ID" ]; then
            echo "GitHub Secret APPS_SCRIPT_ID belum diisi."
            exit 1
          fi
          cat > .clasp.json <<EOF
          {
            "scriptId": "$APPS_SCRIPT_ID",
            "rootDir": "backend"
          }
          EOF

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "GitHub Secret CLASPRC_JSON belum diisi."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Create Apps Script version
        id: version
        run: |
          OUTPUT=$(clasp version "GitHub ${GITHUB_SHA:0:7}")
          echo "$OUTPUT"
          VERSION=$(echo "$OUTPUT" | grep -oE '[0-9]+' | tail -n 1)
          if [ -z "$VERSION" ]; then
            echo "Gagal mendapatkan nomor versi Apps Script."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update existing Web App deployment
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "GitHub Secret APPS_SCRIPT_DEPLOYMENT_ID belum diisi."
            exit 1
          fi
          clasp deploy \
            --deploymentId "$DEPLOYMENT_ID" \
            --versionNumber "$VERSION" \
            --description "GitHub ${GITHUB_SHA:0:7}"
