name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.clasp.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: \${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON GitHub Secret belum diisi."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Create Apps Script version
        id: version
        run: |
          VERSION=$(clasp version "GitHub \${GITHUB_SHA:0:7}" | tail -n 1 | grep -oE '[0-9]+' | tail -n 1)
          if [ -z "$VERSION" ]; then
            echo "Gagal mendapatkan nomor versi Apps Script."
            clasp versions
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Apps Script version: $VERSION"

      - name: Update existing web deployment
        env:
          VERSION: \${{ steps.version.outputs.version }}
        run: |
          DEPLOYMENTS=$(clasp deployments)
          echo "$DEPLOYMENTS"

          DEPLOYMENT_ID=$(echo "$DEPLOYMENTS" | grep -Eo 'AKfy[a-zA-Z0-9_-]+' | head -n 1)

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Deployment ID belum ditemukan."
            echo "Jalankan clasp deployments setelah autentikasi untuk melihat deployment."
            exit 1
          fi

          echo "Menggunakan deployment: $DEPLOYMENT_ID"
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --versionNumber "$VERSION" --description "GitHub \${GITHUB_SHA:0:7}"
