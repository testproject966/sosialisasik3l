<!doctype html>
<html lang="id"><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#132238}.wrap{max-width:620px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #00000012}h1{font-size:25px;margin:0 0 4px}.muted{color:#68778b;font-size:13px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer}.primary{background:#0d6efd;color:#fff;width:100%}label{font-weight:700;font-size:14px;display:block;margin:12px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7dfeb;border-radius:10px}textarea{min-height:100px}img{max-width:100%;border-radius:12px;margin-top:10px}.ok{padding:12px;background:#eaf8ef;border-radius:10px;color:#217442;display:none}.err{padding:12px;background:#fff0f0;border-radius:10px;color:#a12626;display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{font-size:25px;font-weight:800}
</style></head><body><div class="wrap">
<div class="card"><h1>⚡ Sosialisasi Bahaya Listrik</h1><div class="muted">PLN ULP Empang</div></div>
<div class="card"><h2>📸 Laporan Sosialisasi</h2>
<label>Nama Petugas *</label><input id="nama" placeholder="Nama lengkap">
<label>Lokasi Kegiatan</label><input id="lokasi" placeholder="Contoh: Desa Empang">
<label>Keterangan *</label><textarea id="ket" placeholder="Keterangan kegiatan sosialisasi"></textarea>
<label>Foto Kegiatan *</label><input id="foto" type="file" accept="image/*" capture="environment">
<img id="preview" style="display:none"><div id="ok" class="ok"></div><div id="err" class="err"></div>
<br><button class="btn primary" id="send" onclick="submitForm()">📤 KIRIM LAPORAN</button></div>
<div class="card"><h2>📊 Rekap</h2><div class="grid"><div><div class="stat" id="count">0</div><div class="muted">Laporan</div></div><div><div class="stat" id="materials">0</div><div class="muted">Materi</div></div></div></div>
</div><script>
let current=null;
document.getElementById('foto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;current=f;const r=new FileReader();r.onload=x=>{const p=document.getElementById('preview');p.src=x.target.result;p.style.display='block'};r.readAsDataURL(f)});
function call(name,args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[name](args))}
async function submitForm(){const btn=document.getElementById('send');const err=document.getElementById('err');const ok=document.getElementById('ok');err.style.display='none';ok.style.display='none';if(!current){err.textContent='Foto kegiatan wajib diisi.';err.style.display='block';return}btn.disabled=true;btn.textContent='Mengirim...';try{const base=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(current)});const result=await call('saveReport',{nama:document.getElementById('nama').value.trim(),lokasi:document.getElementById('lokasi').value.trim(),keterangan:document.getElementById('ket').value.trim(),photoBase64:base,mimeType:current.type});ok.innerHTML='✅ Laporan berhasil dikirim.<br>ID: '+result.id+'<br>'+result.hari+', '+result.tanggal+' '+result.jam;ok.style.display='block';document.getElementById('nama').value='';document.getElementById('lokasi').value='';document.getElementById('ket').value='';document.getElementById('foto').value='';document.getElementById('preview').style.display='none';current=null;load()}catch(e){err.textContent=e.message||e;err.style.display='block'}finally{btn.disabled=false;btn.textContent='📤 KIRIM LAPORAN'}}
async function load(){try{const d=await call('getData');document.getElementById('count').textContent=d.laporan.length;document.getElementById('materials').textContent=d.materi.length}catch(e){console.log(e)}}load();
</script></body></html>
