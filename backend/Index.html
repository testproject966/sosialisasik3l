<!doctype html><html lang="id"><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial;margin:0;background:#f3f6fa;color:#182433}.wrap{max-width:600px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 3px 14px #0001}h1{font-size:23px}label{font-weight:bold;display:block;margin:12px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d5dce5;border-radius:10px}textarea{min-height:100px}.btn{width:100%;padding:14px;border:0;border-radius:11px;background:#0878f9;color:white;font-weight:bold;font-size:16px}.ok,.err{display:none;padding:12px;border-radius:10px;margin-top:12px}.ok{background:#e8f8ed;color:#18723a}.err{background:#ffeded;color:#a22}.preview{max-width:100%;border-radius:12px;margin-top:10px;display:none}</style></head><body><div class="wrap">
<div class="card"><h1>⚡ Sosialisasi Bahaya Listrik</h1><div>PLN ULP Empang</div></div>
<div class="card"><label>Nama Petugas *</label><input id="nama" placeholder="Nama lengkap"><label>Unit</label><input value="ULP Empang" disabled><label>Lokasi *</label><input id="lokasi" placeholder="Lokasi kegiatan"><label>Keterangan *</label><textarea id="ket" placeholder="Keterangan sosialisasi"></textarea><label>Foto *</label><input id="foto" type="file" accept="image/*" capture="environment"><img id="preview" class="preview"><div id="ok" class="ok"></div><div id="err" class="err"></div><br><button class="btn" onclick="send()">📤 KIRIM LAPORAN</button></div></div>
<script>
let file=null;document.getElementById('foto').onchange=e=>{file=e.target.files[0];if(file){let r=new FileReader();r.onload=x=>{preview.src=x.target.result;preview.style.display='block'};r.readAsDataURL(file)}};
function send(){ok.style.display='none';err.style.display='none';if(!nama.value.trim()||!lokasi.value.trim()||!ket.value.trim()||!file){err.textContent='Nama, lokasi, keterangan dan foto wajib diisi.';err.style.display='block';return}let r=new FileReader();r.onload=()=>google.script.run.withSuccessHandler(x=>{ok.innerHTML='✅ Laporan berhasil dikirim.<br>'+x.hari+', '+x.tanggal;ok.style.display='block';nama.value='';lokasi.value='';ket.value='';foto.value='';preview.style.display='none';file=null}).withFailureHandler(e=>{err.textContent=e.message;err.style.display='block'}).saveReport({nama:nama.value.trim(),lokasi:lokasi.value.trim(),keterangan:ket.value.trim(),photoBase64:r.result,mimeType:file.type});r.readAsDataURL(file)}
</script></body></html>
